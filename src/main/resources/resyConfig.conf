# Resy Booking Bot config
#
# Keep secrets out of this repo. Provide credentials via environment variables:
#   export RESY_API_KEY="..."
#   export RESY_AUTH_TOKEN="..."
#
# Or pass a separate config file at runtime:
#   sbt "run --config /path/to/resyConfig.conf"

resyKeys {
  api-key = ${?RESY_API_KEY}
  auth-token = ${?RESY_AUTH_TOKEN}
}

resDetails {
  # YYYY-MM-DD
  date = "2026-02-12"

  party-size = 2
  venue-id = 60058

  # Priority list of reservation times and optional table types.
  # If `reservation-time` is empty (""), the bot treats it as a wildcard and picks the available time closest to the
  # first non-empty `reservation-time` in this list (tie-break: earlier time), optionally filtered by `table-type`.
  # If there is no non-empty `reservation-time` in the list, it falls back to the median available time
  # (lower median when there's an even number of times).
  res-time-types = [
    { reservation-time = "18:00:00", table-type = "Dining Room" },
    { reservation-time = "18:30:00", table-type = "Dining Room" },
    { reservation-time = "19:00:00", table-type = "Dining Room" }
  ]
}

# Local time of the machine the bot is running on.
snipeTime {
  hours = 9
  minutes = 0
}
