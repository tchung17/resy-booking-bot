# Resy Booking Bot config
#
# Recommended: keep secrets out of this repo.
# Provide credentials via environment variables:
#   export RESY_API_KEY="..."
#   export RESY_AUTH_TOKEN="..."
#
# Or pass a separate config file at runtime:
#   sbt "run --config /path/to/resyConfig.conf"

resyKeys {
  apiKey = ${?RESY_API_KEY}
  authToken = ${?RESY_AUTH_TOKEN}
}

resDetails {
  # YYYY-MM-DD
  date = "2099-01-30"

  partySize = 2
  venueId = 0

  # Priority list of reservation times and optional table types.
  resTimeTypes = [
    { reservationTime = "18:00:00", tableType = "Dining Room" }
  ]
}

# Local time of the machine the bot is running on.
snipeTime {
  hours = 9
  minutes = 0
}
